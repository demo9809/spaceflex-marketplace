<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <linearGradient id="cc-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cc-sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#e2d4be" />
    </linearGradient>
    <filter id="cc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="200" height="200" rx="44" fill="url(#cc-bg)" />
  
  <!-- Subtle border ring -->
  <rect x="3" y="3" width="194" height="194" rx="41" fill="none" stroke="url(#cc-sand)" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Corniche Crest: Curved sea arc + Interlocking C & Co emblem -->
  <g filter="url(#cc-shadow)">
    <!-- Sea horizon arc -->
    <path d="M 64 68 C 76 56, 124 56, 136 68" 
          fill="none" 
          stroke="url(#cc-blue)" 
          stroke-width="2.5" 
          stroke-linecap="round" />
          
    <!-- Stylized Monogram C -->
    <path d="M 112 52 C 86 52, 70 66, 70 82 C 70 98, 86 112, 112 112" 
          fill="none" 
          stroke="url(#cc-sand)" 
          stroke-width="6" 
          stroke-linecap="round" />
          
    <!-- Ampersand & Dot Accent -->
    <circle cx="120" cy="82" r="5" fill="url(#cc-blue)" />
    <path d="M 124 74 C 118 70, 114 74, 118 80 L 126 90 C 130 94, 134 92, 132 88" 
          fill="none" 
          stroke="url(#cc-sand)" 
          stroke-width="3" 
          stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="100" y="142" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Didot', 'Bodoni MT', serif" 
        font-size="14.5" 
        font-weight="700" 
        letter-spacing="3.5" 
        fill="url(#cc-sand)" 
        text-anchor="middle">CORNICHE &amp; CO.</text>
        
  <text x="100" y="162" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" 
        font-size="7.5" 
        font-weight="500" 
        letter-spacing="3" 
        fill="url(#cc-blue)" 
        text-anchor="middle">PRIVATE ADVISORY</text>

  <text x="100" y="176" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" 
        font-size="6" 
        font-weight="400" 
        letter-spacing="2" 
        fill="#ffffff" 
        fill-opacity="0.5" 
        text-anchor="middle">DOHA · QATAR</text>
</svg>
